<!DOCTYPE html>
<html>
<head>
    <title>Be My Galentine 💕</title>

    <style>
        body {
            background: linear-gradient(to right, #ffb6d9, #ffe6f2);
            font-family: "Comic Sans MS", cursive;
            text-align: center;
            padding: 40px;
            color: #5a005a;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0px 0px 25px pink;
            max-width: 650px;
            margin: auto;
        }

        h1 {
            color: #e9a8cb;
        }

        .question {
            margin: 25px 0;
            text-align: left;
        }

        /* Hide default radio buttons */
        input[type="radio"] {
            display: none;
        }

        /* Cute option cards */
        .option {
            display: block;
            background: #ffe6f2;
            padding: 12px;
            margin: 8px 0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .option:hover {
            background: #ffccf2;
            transform: scale(1.03);
        }

        /* When selected */
        input[type="radio"]:checked + .option {
            background: #ff99cc;
            border: 2px solid #ff1493;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 10px hotpink;
        }

        button {
            background-color: #ff69b4;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #ff1493;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💌 If You Know Me Well...</h1>
    <p>Answer these questions to qualify as my Galentine 💖</p>

    <form action="/result" method="post">

        <div class="question">
            <p>1. What's my comfort food?</p>

            <input type="radio" id="q1a" name="q1" value="a">
            <label for="q1a" class="option"> Mandi</label>

            <input type="radio" id="q1b" name="q1" value="b">
            <label for="q1b" class="option"> Biryani</label>

            <input type="radio" id="q1c" name="q1" value="c">
            <label for="q1c" class="option"> Noodles</label>
        </div>

        <div class="question">
            <p>2. My favorite flower?</p>

            <input type="radio" id="q2a" name="q2" value="a">
            <label for="q2a" class="option">Rose </label>

            <input type="radio" id="q2b" name="q2" value="b">
            <label for="q2b" class="option">Tulips</label>

            <input type="radio" id="q2c" name="q2" value="c">
            <label for="q2c" class="option">Jasmines</label>
        </div>

        <div class="question">
            <p>3. My favorite movie genre?</p>

            <input type="radio" id="q3a" name="q3" value="a">
            <label for="q3a" class="option">👻 Horror</label>

            <input type="radio" id="q3b" name="q3" value="b">
            <label for="q3b" class="option">💥 Action</label>

            <input type="radio" id="q3c" name="q3" value="c">
            <label for="q3c" class="option">💕 Rom-Com</label>
        </div>

        <div class="question">
            <p>4. My biggest fear?</p>

            <input type="radio" id="q4a" name="q4" value="a">
            <label for="q4a" class="option">Cockroch</label>

            <input type="radio" id="q4b" name="q4" value="b">
            <label for="q4b" class="option">🥺 Losing you</label>

            <input type="radio" id="q4c" name="q4" value="c">
            <label for="q4c" class="option">Bananas</label>
        </div>

        <div class="question">
            <p>5. My love language?</p>

            <input type="radio" id="q5a" name="q5" value="a">
            <label for="q5a" class="option">💌 Words of affirmation</label>

            <input type="radio" id="q5b" name="q5" value="b">
            <label for="q5b" class="option">🎁 Gifts</label>

            <input type="radio" id="q5c" name="q5" value="c">
            <label for="q5c" class="option">💖 Acts of service</label>
        </div>

        <button type="submit">Submit Answers 💘</button>

    </form>
</div>

</body>
</html>
